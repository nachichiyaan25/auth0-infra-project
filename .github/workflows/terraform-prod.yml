name: Terraform Prod Deploy

on:
  push:
    branches:
      - main

jobs:

  deploy-prod:

    runs-on: ubuntu-latest

    environment: prod

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1

      TF_VAR_secret_key: ${{ secrets.TF_VAR_SECRET_KEY }}
      TF_VAR_auth0_client_id: ${{ secrets.TF_VAR_AUTH0_CLIENT_ID }}
      TF_VAR_auth0_client_secret: ${{ secrets.TF_VAR_AUTH0_CLIENT_SECRET }}
      TF_VAR_auth0_domain: ${{ secrets.TF_VAR_AUTH0_DOMAIN }}
      TF_VAR_auth0_audience: ${{ secrets.TF_VAR_AUTH0_AUDIENCE }}
      TF_VAR_auth0_m2m_client_id: ${{ secrets.TF_VAR_AUTH0_M2M_CLIENT_ID }}
      TF_VAR_auth0_m2m_client_secret: ${{ secrets.TF_VAR_AUTH0_M2M_CLIENT_SECRET }}
      TF_VAR_auth0_management_api_audience: ${{ secrets.TF_VAR_AUTH0_MANAGEMENT_API_AUDIENCE }}
      TF_VAR_github_actions_public_key: ${{ secrets.TF_VAR_GITHUB_ACTIONS_PUBLIC_KEY }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        run: terraform apply -input=false -auto-approve -lock-timeout=30s

      - name: Get EC2 Public IP
        id: ec2
        working-directory: terraform/environments/prod
        run: |
          echo "HOST=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT

      - name: Wait for Cloud Initialization
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ec2.outputs.HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          
          command_timeout: 20m
          script: |

            echo "======================================="
            echo "Waiting for cloud-init to finish..."
            echo "======================================="

            sudo cloud-init status --wait

            echo "======================================="
            echo "Cloud initialization completed."
            echo "======================================="

            docker --version
            docker compose version
            git --version

            echo "Instance is ready for deployment."

      - name: Deploy Latest Platform Version
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ec2.outputs.HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            echo "======================================="
            echo "Deploying latest application..."
            echo "======================================="

            cd ~/auth0-infra-project

            git fetch origin
            git checkout main
            git reset --hard origin/main

            docker compose down
            docker compose up -d --build
            docker compose ps
            docker image prune -f

            echo ""
            echo "Waiting for Django health endpoint..."
            echo ""

            for i in {1..12}; do

              if curl --silent --fail http://localhost:8000/api/health/ > /dev/null; then

                echo "======================================="
                echo "Health check passed."
                echo "Application deployment successful."
                echo "======================================="

                exit 0
              fi

              echo "Attempt $i/12 : Application not ready. Retrying in 5 seconds..."

              sleep 5

            done

            echo "======================================="
            echo "Health check failed."
            echo "Application failed to become healthy."
            echo "======================================="

            docker compose ps
            docker compose logs --tail=100

            exit 1

