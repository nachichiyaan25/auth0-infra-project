name: Terraform Dev Deploy

on:
  push:
    branches:
      - dev

jobs:

  deploy-dev:

    environment: dev

    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1

      TF_VAR_secret_key: ${{ secrets.TF_VAR_SECRET_KEY }}
      TF_VAR_auth0_client_id: ${{ secrets.TF_VAR_AUTH0_CLIENT_ID }}
      TF_VAR_auth0_client_secret: ${{ secrets.TF_VAR_AUTH0_CLIENT_SECRET }}
      TF_VAR_auth0_domain: ${{ secrets.TF_VAR_AUTH0_DOMAIN }}
      TF_VAR_auth0_audience: ${{ secrets.TF_VAR_AUTH0_AUDIENCE }}
      TF_VAR_auth0_m2m_client_id: ${{ secrets.TF_VAR_AUTH0_M2M_CLIENT_ID }}
      TF_VAR_auth0_m2m_client_secret: ${{ secrets.TF_VAR_AUTH0_M2M_CLIENT_SECRET }}
      TF_VAR_auth0_management_api_audience: ${{ secrets.TF_VAR_AUTH0_MANAGEMENT_API_AUDIENCE }}
      TF_VAR_github_actions_public_key: ${{ secrets.TF_VAR_GITHUB_ACTIONS_PUBLIC_KEY }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -input=false -auto-approve -lock-timeout=30s

      - name: Get EC2 Public IP
        id: ec2
        working-directory: terraform/environments/dev
        run: |
          echo "HOST=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT

      - name: Deploy Latest Application
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ec2.outputs.HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/auth0-infra-project

            git fetch origin
            git checkout dev
            git reset --hard origin/dev

            docker compose down
            docker compose up -d --build
            docker compose ps
            docker image prune -f

            echo "Waiting for application to become healthy..."

            for i in {1..12}; do

              if curl --silent --fail http://localhost:8000/api/health/; then
                echo "Application is healthy."
                exit 0
              fi

              echo "Application not ready yet... retrying in 5 seconds."

              sleep 5

            done

            echo "Application failed health check."

            exit 1

      - name: Retry deployment once if SSH was not ready
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ec2.outputs.HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sleep 30

            cd ~/auth0-infra-project

            git fetch origin
            git checkout dev
            git reset --hard origin/dev

            docker compose down
            docker compose up -d --build
            docker compose ps
            docker image prune -f

            echo "Waiting for application to become healthy..."

            for i in {1..12}; do
              if curl --silent --fail http://localhost:8000/api/health/; then
                echo "Application is healthy."
                exit 0
              fi

              echo "Application not ready yet... retrying in 5 seconds."
              sleep 5
            done

            echo "Application failed health check."
            exit 1
